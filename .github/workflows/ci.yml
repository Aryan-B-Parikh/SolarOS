name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solaros_user
          POSTGRES_PASSWORD: solaros_password
          POSTGRES_DB: solaros
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://solaros_user:solaros_password@localhost:5432/solaros?schema=public"
      AUTH_SECRET: "ci-auth-secret-for-testing-123456789"
      APP_BASE_URL: "http://localhost:3000"
      CRON_SECRET: "ci-cron-secret-12345"
      APP_TIMEZONE: "Asia/Kolkata"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check .

      - name: ESLint check (Module boundaries)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Generate Prisma client & Run migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build

