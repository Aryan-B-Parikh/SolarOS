version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: solaros-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solaros_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solaros_password}
      POSTGRES_DB: ${POSTGRES_DB:-solaros}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solaros_user} -d ${POSTGRES_DB:-solaros}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solaros_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solaros-prod-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-solaros_user}:${POSTGRES_PASSWORD:-solaros_password}@postgres:5432/${POSTGRES_DB:-solaros}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-https://ops.sunpower.in}
      CRON_SECRET: ${CRON_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - solaros_internal
    expose:
      - "3000"

  nginx:
    image: nginx:1.25-alpine
    container_name: solaros-prod-proxy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - solaros_internal

  certbot:
    image: certbot/certbot:latest
    container_name: solaros-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - solaros_internal

networks:
  solaros_internal:
    driver: bridge

volumes:
  prod_postgres_data:
  certbot_certs:
  certbot_www:

